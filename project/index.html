    <!-- Safeguard against Chrome Extensions / Runner attempting window.fetch assignment -->
    <script>
      (function() {
        try {
          var originalFetch = window.fetch || function() {};
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          // Ignore if descriptor cannot be modified
        }

        window.addEventListener('error', function(e) {
          if ((e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
              (e.message && e.message.indexOf('Cannot set property fetch') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
